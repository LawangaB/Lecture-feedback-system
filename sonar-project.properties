
sonar.projectKey=gayanviduranga95_Lecture-feedback-system
sonar.organization=gayanviduranga95
sonar.projectName=Lecture Feedback System

# Application source code
sonar.sources=backend/src,frontend/src

# Test code is analyzed as test code, not counted as production code coverage.
sonar.tests=backend/tests,frontend/src/__tests__
sonar.test.inclusions=backend/tests/**,frontend/src/__tests__/**

# Exclude generated files, test code, and non-application tool configuration from production scope.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,backend/tests/**,frontend/src/__tests__/**,backend/prisma.config.ts,backend/vitest.config.ts

# Import backend and frontend test coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
