
name: SonarQube

on:
  push:
    branches:
      - main
      - testing/sonarqube-analysis
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Test and analyze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lfps
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: lecture_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lfps -d lecture_feedback_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://lfps:dev_only_password@127.0.0.1:5432/lecture_feedback_test?schema=public"
      TEST_DATABASE_URL: "postgresql://lfps:dev_only_password@127.0.0.1:5432/lecture_feedback_test?schema=public"
      SESSION_SECRET: "test-only-session-secret-0123456789abcdef-xxxxxxxx"
      JOIN_CODE_KEY: "test-only-join-code-key-0123456789abcdef-xxxxxxxx"
      FRONTEND_ORIGIN: "http://localhost:5173"
      LOG_LEVEL: silent

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify database URL
        run: |
          node -e "
          const keys = ['DATABASE_URL', 'TEST_DATABASE_URL'];
          for (const key of keys) {
            const raw = process.env[key];
            if (!raw) throw new Error(key + ' is missing');
            const url = new URL(raw);
            if (!['postgresql:', 'postgres:'].includes(url.protocol)) {
              throw new Error(key + ' has invalid protocol');
            }
            if (url.pathname !== '/lecture_feedback_test') {
              throw new Error(key + ' points to wrong database');
            }
            console.log(key + ' configuration verified');
          }
          "

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Backend tests with coverage
        working-directory: backend
        run: |
          npx vitest run --coverage \
            --coverage.reporter=text \
            --coverage.reporter=lcov

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests with coverage
        working-directory: frontend
        run: |
          npx vitest run --coverage \
            --coverage.reporter=text \
            --coverage.reporter=lcov

      - name: Verify coverage reports
        run: |
          test -f backend/coverage/lcov.info
          test -f frontend/coverage/lcov.info
          echo "Backend and frontend coverage reports exist."

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Only scan trusted branches and same-repository PRs.
      # GitHub normally withholds secrets from forked PRs.
      - name: Verify SonarQube token
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing."
            exit 1
          fi
          echo "SonarQube authentication token is available."

      - name: SonarQube Scan
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=gayanviduranga95
            -Dsonar.projectKey=gayanviduranga95_Lecture-feedback-system
