name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: lfps, POSTGRES_PASSWORD: ci_only_password, POSTGRES_DB: lecture_feedback_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lfps" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lfps:ci_only_password@localhost:5432/lecture_feedback_test?schema=public
      DATABASE_URL: postgresql://lfps:ci_only_password@localhost:5432/lecture_feedback_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npm run typecheck && npm run lint && npm test && npm run build
          npm audit --omit=dev --audit-level=high
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck && npm run lint && npm test && npm run build
          npm audit --omit=dev --audit-level=high
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    if: false # enable once the seeded E2E environment is wired in your CI (see docs/TESTING.md)
    steps: [{ run: "echo 'see docs/TESTING.md'" }]
